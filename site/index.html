<script>
/* ===== 一次性自毁：注销 Service Worker + 清空所有缓存 =====
 * 背景：SW v1 用 stale-while-revalidate 缓存了旧 app.js，
 * 导致代码更新后页面仍跑旧版，且 Ctrl+F5 无法绕过。
 * 这段脚本只需执行一次（成功后写标记），之后不再触发。
 */
(function () {
  // 版本指纹：本段逻辑每次改动都要改这个值。
  // 目的：即使旧 SW 缓存了旧 index.html，也能通过「无缓存脚本」纠正。
  var FLAG = 'zlfx.cacheReset.v4';
  var VERSION = 'v3.6';

  function doReset() {
    var tasks = [];

    // 1) 注销所有 Service Worker
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      tasks.push(
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).catch(function () {})
      );
    }

    // 2) 删除所有 Cache Storage
    if (window.caches && caches.keys) {
      tasks.push(
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {})
      );
    }

    // 3) 清掉可能残留的 localStorage 版本标记（保留登录 token）
    try {
      localStorage.removeItem('zlfx.pageVer');
      localStorage.removeItem('zlfx.port');
      localStorage.removeItem('zlfx.cacheReset.v1');
      localStorage.removeItem('zlfx.cacheReset.v2');
      localStorage.removeItem('zlfx.cacheReset.v3');
    } catch (e) {}

    return Promise.all(tasks);
  }

  // 判断是否需要清理：标记不是当前版本，就清一次
  var done = false;
  try { done = localStorage.getItem(FLAG) === VERSION; } catch (e) {}

  if (!done) {
    // 先展示提示，避免用户以为卡住
    document.addEventListener('DOMContentLoaded', function () {
      var tip = document.createElement('div');
      tip.style.cssText = 'position:fixed;inset:0;background:#1b1f3b;color:#fff;' +
        'display:flex;align-items:center;justify-content:center;flex-direction:column;' +
        'gap:14px;z-index:99999;font:15px/1.6 system-ui,sans-serif';
      tip.innerHTML = '<div style="font-size:34px">🧹</div>' +
        '<div>正在清理旧缓存…</div>' +
        '<div style="font-size:12.5px;color:#9aa6c6">完成后会自动刷新</div>';
      document.body.appendChild(tip);
    });

    doReset().then(function () {
      try { localStorage.setItem(FLAG, VERSION); } catch (e) {}
      // 加时间戳强刷，绕过任何中间缓存
      var u = location.href.split('#')[0];
      var sep = u.indexOf('?') >= 0 ? '&' : '?';
      location.replace(u + sep + '_r=' + Date.now() + location.hash);
    }).catch(function () {
      // 失败也标记，避免死循环
      try { localStorage.setItem(FLAG, VERSION); } catch (e) {}
    });
  }
})();
</script>

<script>
/* 布局诊断：双击页面任意处，弹出关键渲染数据，用于定位“选项错位”问题 */
(function () {
  function diag() {
    var out = [];
    function rect(sel, label) {
      var el = document.querySelector(sel);
      if (!el) { out.push(label + ': 不存在'); return; }
      var r = el.getBoundingClientRect();
      out.push(label + ': x=' + Math.round(r.left) + ' y=' + Math.round(r.top) +
        ' w=' + Math.round(r.width) + ' h=' + Math.round(r.height));
    }
    out.push('innerWidth=' + window.innerWidth + ' innerHeight=' + window.innerHeight +
      ' dpr=' + window.devicePixelRatio);
    out.push('scrollW=' + document.documentElement.scrollWidth + ' bodyW=' + document.body.scrollWidth);
    rect('.practice', '.practice');
    rect('.q-card', '.q-card');
    rect('.q-body', '.q-body');
    rect('.options', '.options');
    rect('.opt', '第一个.opt');
    rect('.side-panel', '.side-panel');
    var o = document.querySelector('.options');
    var q = document.querySelector('.q-card');
    if (o && q) {
      out.push('options在q-card内: ' + q.contains(o));
      var cs = getComputedStyle(q);
      out.push('q-card display=' + cs.display + ' width=' + cs.width);
      var co = getComputedStyle(o);
      out.push('options display=' + co.display + ' flexDir=' + co.flexDirection + ' width=' + co.width);
    }
    var hint = document.getElementById('portHint');
    if (hint) {
      hint.textContent = out.join(' ｜ ');
      hint.classList.remove('hidden');
      hint.style.background = '#0f9d63';
      hint.style.whiteSpace = 'pre-wrap';
      hint.style.maxWidth = '92vw';
      hint.style.top = '60px';
      setTimeout(function () { hint.classList.add('hidden'); hint.style.background = ''; hint.style.top = ''; }, 20000);
    } else {
      alert(out.join('\n'));
    }
  }
  document.addEventListener('dblclick', function(e) {
    // 忽略在可交互元素上的双击（按钮/链接/选项/展开收起等），避免误触发诊断
    if (e.target.closest('button, a, input, select, textarea, .opt, .explain-h, .material-h, label')) return;
    diag();
  });
})();
</script>

<script>
/* 版本 + 端口探测：页面被缓存或换了端口时提示，避免账号“丢失”的错觉 */
(function () {
  var VER = 'v7.8';
  window.__APP_VER__ = VER;   // 供 selfheal.js 读取
  var KEY = 'zlfx.pageVer';
  var PORT_KEY = 'zlfx.port';
  try {
    var prev = localStorage.getItem(KEY);
    var curPort = location.port || '80';
    var prevPort = localStorage.getItem(PORT_KEY);

    var tips = [];
    if (prev && prev !== VER) tips.push('检测到新版本，请按 Ctrl+F5 强制刷新');
    if (prevPort && prevPort !== curPort) {
      tips.push('端口从 ' + prevPort + ' 换到了 ' + curPort +
        '，之前注册的账号在 ' + prevPort + ' 上（浏览器按端口隔离存储）');
    }
    if (tips.length) {
      setTimeout(function () {
        var hint = document.getElementById('portHint');
        if (hint) {
          hint.textContent = tips.join('；');
          hint.classList.remove('hidden');
          setTimeout(function () { hint.classList.add('hidden'); }, 12000);
        }
      }, 1200);
    }
    localStorage.setItem(KEY, VER);
    localStorage.setItem(PORT_KEY, curPort);
  } catch (e) { /* 隐私模式忽略 */ }
})();
</script>

<script>
/* PWA：注册 Service Worker + 安装到桌面/主屏幕 */
(function () {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
    });
  }

  var deferred = null;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    showInstallBtn();
  });

  function showInstallBtn() {
    if (document.getElementById('pwaInstall')) return;
    var bar = document.createElement('div');
    bar.id = 'pwaInstall';
    bar.innerHTML = '<span>安装到设备，像 App 一样使用</span>' +
      '<button id="pwaInstallBtn">立即安装</button>' +
      '<button id="pwaInstallClose" title="关闭">×</button>';
    document.body.appendChild(bar);

    document.getElementById('pwaInstallBtn').onclick = function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; bar.remove(); });
    };
    document.getElementById('pwaInstallClose').onclick = function () {
      bar.remove();
      try { localStorage.setItem('pwaInstallDismissed', '1'); } catch (e) {}
    };
  }

  // iOS Safari 不支持 beforeinstallprompt，给出「添加到主屏幕」指引
  window.addEventListener('load', function () {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var standalone = window.navigator.standalone === true;
    var dismissed = false;
    try { dismissed = localStorage.getItem('pwaInstallDismissed') === '1'; } catch (e) {}
    if (isIOS && !standalone && !dismissed) {
      setTimeout(function () {
        if (document.getElementById('pwaInstall')) return;
        var bar = document.createElement('div');
        bar.id = 'pwaInstall';
        bar.innerHTML = '<span>点下方分享按钮 →「添加到主屏幕」即可当 App 用</span>' +
          '<button id="pwaInstallClose" title="关闭">×</button>';
        document.body.appendChild(bar);
        document.getElementById('pwaInstallClose').onclick = function () { bar.remove(); };
      }, 2500);
    }
  });
})();
</script>
